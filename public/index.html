<style>
:root{
  --bg:#F2F4F7;--surface:#FFFFFF;--surface2:#F7F8FA;--line:#E0E4EA;--line2:#C9CFD9;
  --ink:#131822;--ink2:#394253;--muted:#687184;
  --accent:#2347D4;--accent-ink:#FFFFFF;--accent-soft:#E6EBFC;
  --ok:#157A3C;--ok-soft:#E2F3E8;--warn:#A95205;--warn-soft:#FCEFDD;--crit:#C22727;--crit-soft:#FBE6E6;
  --shadow:0 1px 2px rgba(19,24,34,.05),0 8px 28px rgba(19,24,34,.08);
  --font:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --bg:#0D1016;--surface:#151921;--surface2:#1A1F28;--line:#282E3A;--line2:#384151;--ink:#E8EBF1;--ink2:#C2C8D4;--muted:#8C95A7;
  --accent:#7D96FF;--accent-ink:#0D1016;--accent-soft:#1D2641;--ok:#56C987;--ok-soft:#132A1D;--warn:#F0A53A;--warn-soft:#2D2313;--crit:#F27474;--crit-soft:#321A1D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.01em;text-wrap:balance}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-inline:24px}
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15}
.top .wrap{display:flex;align-items:center;gap:18px;height:58px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{display:block;font-size:14px;letter-spacing:.03em}
.brand span{display:block;font-size:11.5px;color:var(--muted)}
.nav{display:flex;gap:2px}
.nav button{all:unset;cursor:pointer;padding:7px 12px;border-radius:8px;color:var(--ink2);font-weight:500}
.nav button:hover{background:var(--surface2)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.who{margin-left:auto;display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;font-size:12.5px;color:var(--muted)}
main{padding-block:26px 90px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:22px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid2>*{min-width:0}
.thbtn{padding:2px 7px!important;font-size:11px!important;margin-left:4px}
.thlist{display:flex;flex-direction:column;gap:8px}.thitem{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.thitem.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.thitem .prev{width:48px;height:60px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);overflow:hidden;flex:none}.thitem .prev img{width:100%;height:100%;object-fit:cover}
.rpgo{white-space:nowrap;color:var(--accent);font-weight:600}
.rtool{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}.rtool .rg{display:flex;flex-direction:column;gap:7px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.rtool .rl{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.print-only{display:none}
.pcover,.peod{flex-direction:column;justify-content:center;gap:14px;height:182mm;padding:18mm;border-radius:0;background:var(--th-bg,#161B26);color:var(--th-ink,#fff);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pcover{break-after:page}.peod{break-before:page;align-items:center;text-align:center}
.pcover .pb{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.04em}.pcover .pb img{width:34px;height:34px;border-radius:50%}
.pcover .pe{font-size:12px;letter-spacing:.18em;opacity:.7;margin-top:auto}.pcover .pt{font-size:34px;font-weight:700;line-height:1.25}.pcover .pm{font-size:13px;opacity:.8;display:flex;flex-wrap:wrap;gap:6px 18px}.pcover .pf{margin-top:auto;font-size:11px;opacity:.6}
.peod .eod{font-size:64px;font-weight:700;letter-spacing:.12em}.peod .et{font-size:15px;font-weight:600}.peod .em{font-size:13px;opacity:.8}
.mchk{display:flex;flex-wrap:wrap;gap:8px}.mchk label{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;cursor:pointer;background:var(--surface)}.mchk label.off{color:var(--muted);background:var(--surface2);text-decoration:line-through}
.cmp{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.cmp i{display:inline-block;height:6px;border-radius:3px;background:var(--accent);min-width:2px}
.tcalc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}.tcalc div{background:var(--surface2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}.tcalc span{font-size:11.5px;color:var(--muted)}.tcalc b{font-size:16px;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}

function routeOf(){const v=A.view;if(v==='campaign')return {v,c:A.cid,t:A.tab||'overview'};if(v==='create')return {v,k:kindOf(A.draft)};if(v==='team')return {v,tt:A.teamTab==='int'?'int':A.teamTab==='accts'?'accts':'members'};if(v==='cvc')return {v,c:A.cvId};
  if(VIEW_KIND[v])return {v,lt:A.ltab==='groups'?'groups':'camps'};return {v}}
function routeHash(r){if(r.v==='campaign')return `#/c/${r.c}/${r.t}`;if(r.v==='create')return `#/new/${r.k}`;if(r.v==='team')return '#/team'+(r.tt!=='members'?'/'+r.tt:'');if(r.v==='cvc')return `#/cv/${r.c}`;if(r.lt==='groups')return `#/${r.v}/groups`;return '#/'+r.v}
function parseHash(h){const p=String(h||'').replace(/^#\/?/,'').split('/').filter(Boolean).map(x=>{try{return decodeURIComponent(x)}catch(e){return x}});if(!p.length)return null;
  if(p[0]==='c'&&p[1])return {v:'campaign',c:p[1],t:p[2]||'overview'};if(p[0]==='new')return {v:'create',k:p[1]||'seed'};if(p[0]==='team')return {v:'team',tt:p[1]||'members'};if(p[0]==='cv'&&p[1])return {v:'cvc',c:p[1]};
  if(VIEW_KIND[p[0]])return {v:p[0],lt:p[1]==='groups'?'groups':'camps'};if(['pool','updates','history','cv','acct'].includes(p[0]))return {v:p[0]};return null}
let ROUTE_LOCK=false;
function routeSync(){if(A.view==='share'||!A.user||!A.admin||ROUTE_LOCK)return;if(A.skipPop){clearTimeout(routeSync.t);routeSync.t=setTimeout(()=>{A.skipPop=0;routeSync()},400);return}const r=routeOf();const h=routeHash(r);const d=!!(A.drawer||A.modal||A.bellOpen||A.more);const st=history.state;
  try{if(!st||!st.h){history.replaceState({h,r,d:false},'',h);if(d)history.pushState({h,r,d:true},'',h);return}
    if(st.h===h){if(d&&!st.d)history.pushState({h,r,d:true},'',h);else if(!d&&st.d){A.skipPop=1;history.back()}return}
    if(st.d&&!d){history.replaceState({h,r,d:false},'',h);return}
    history.pushState({h,r,d:false},'',h);if(d)history.pushState({h,r,d:true},'',h)}catch(e){}}
/* 권한별로 열 수 있는 화면 */
function allowedView(v){if(A.role==='client')return ['cv','cvc','acct'].includes(v);if(A.role==='clientAdmin')return ['cv','cvc','acct','campaign','create',...Object.keys(VIEW_KIND)].includes(v);return !['cv','cvc','acct'].includes(v)}
function applyRoute(r){if(!r)return;if(!allowedView(r.v))r={v:homeView()};ROUTE_LOCK=true;try{A.drawer=null;A.modal=null;A.bellOpen=false;A.more=false;A.confirm=null;A.editName=null;
  if(r.v==='campaign'){if(A.cid!==r.c||A.view!=='campaign')openCampaign(r.c,r.t);else{A.tab=r.t;render()}}
  else if(r.v==='create'){if(A.draft&&A.view==='create')render();else{A.view=homeView(r.k);render()}}
  else{if(A.unsubRows){A.unsubRows();A.unsubRows=null;A.rowsDoc=null}if(VIEW_KIND[r.v]&&r.v!==A.view){A.csel.clear();A.statusF=''}A.view=r.v;if(r.lt)A.ltab=r.lt;if(r.tt)A.teamTab=r.tt;if(r.v==='cvc')A.cvId=r.c;render()}
  window.scrollTo(0,0)}finally{ROUTE_LOCK=false}}
window.addEventListener('popstate',e=>{if(A.view==='share'||!A.user)return;if(A.skipPop){A.skipPop=0;clearTimeout(routeSync.t);setTimeout(routeSync,0);return}const st=e.state;
  if((A.drawer||A.modal||A.bellOpen||A.more)&&!(st&&st.d)&&st&&st.h===routeHash(routeOf())){A.drawer=null;A.modal=null;A.bellOpen=false;A.more=false;A.confirm=null;ROUTE_LOCK=true;try{render()}finally{ROUTE_LOCK=false}return}
  const r=(st&&st.r)||parseHash(location.hash);if(r)applyRoute(r)});
function render(){
  const app=$('#app');const ae=document.activeElement;let keep=null;
  if(ae&&ae.id&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))keep={id:ae.id,v:ae.value,s:ae.selectionStart,e:ae.selectionEnd,t:ae.type,tag:ae.tagName};
  const sc=[...document.querySelectorAll('[data-keep-scroll]')].map(e=>[e.dataset.keepScroll,e.scrollLeft,e.scrollTop]);
  const ds=$('.drawer-b')?$('.drawer-b').scrollTop:0;
  let html;
  if(A.view==='share')html=viewShare();
  else if(!A.user)html=viewLogin();
  else if(!A.admin)html=viewNoAccess();
  else html=shell();
  A._r=true;try{app.innerHTML=html}finally{A._r=false}
  applyReadOnly();
  sc.forEach(([k,l,t])=>{const e=document.querySelector(`[data-keep-scroll="${k}"]`);if(e){e.scrollLeft=l;e.scrollTop=t}});
  if($('.drawer-b'))$('.drawer-b').scrollTop=ds;
  if(keep){const el=document.getElementById(keep.id);if(el){if(keep.tag!=='SELECT'&&keep.t!=='checkbox'&&keep.t!=='date')el.value=keep.v;el.focus({preventScroll:true});try{if(keep.s!=null)el.setSelectionRange(keep.s,keep.e)}catch(e){}}}
  routeSync();
}

function logoSrc(){return A.logo||LOGO_SRC}
function brandHtml(){return `<div class="brand"><img class="logo" src="${logoSrc()}" alt="" width="32" height="32"><div><b>RINGCOMS MCN</b><span>광고콘텐츠팀</span></div></div>`}

function watchBrand(){try{DB.watchDoc('public/brand',d=>{const l=d&&d.logo||null;if(l!==A.logo){A.logo=l;scheduleRender()}},()=>{})}catch(e){}}
function logoModal(){const ed=isTeamEdit();return `<div class="lb-bg" data-act="lbClose"></div><div class="lb" role="dialog" aria-modal="true" aria-label="프로필 이미지"><img src="${logoSrc()}" alt="RINGCOMS MCN 프로필 이미지"><div class="lb-f"><span class="small muted grow">${A.logo?'변경한 이미지':'기본 이미지'}${A.logoBy?` · ${esc(A.logoBy)}`:''}</span>
  ${ed?`<label class="btn sm primary" style="cursor:pointer">이미지 변경<input type="file" accept="image/*" data-logo hidden></label>${A.logo?'<button class="btn sm" data-act="logoReset">기본 이미지로</button>':''}`:''}<a class="btn sm" href="${logoSrc()}" download="ringcoms-profile">원본 저장</a><button class="btn sm" data-act="lbClose">닫기</button></div>${ed?'<p class="small muted" style="margin:0">바꾼 이미지는 좌상단·로그인 화면·리포트(PPT·PDF 표지)에 함께 쓰입니다. 정사각형 이미지를 권장합니다.</p>':''}</div>`}

  const rules=document.getElementById('rules-src').textContent.trim();

  if(isCom(c)){t.comm=live.reduce((s,r)=>s+n(rowCalc(r,c).comm),0);t.payout=live.reduce((s,r)=>s+n(rowCalc(r,c).payout),0);t.aov=t.conv&&t.rev?t.rev/t.conv:null;t.vcr=t.viewers&&t.conv?t.conv/t.viewers:null;t.rpm=t.liveMin&&t.rev?t.rev/t.liveMin:null;t.peak=Math.max(0,...list.map(r=>n(r.peak)))}

const IG_RES=new Set(['p','reel','reels','tv','stories','explore','accounts','direct','about','legal','developer']);
function parseChLink(u){let s=String(u||'').trim();if(!s)return null;if(!/^https?:\/\//i.test(s))s='https://'+s;let url;try{url=new URL(s)}catch(e){return null}
  const host=url.hostname.toLowerCase().replace(/^(www|m|mobile)\./,'');const seg=url.pathname.split('/').filter(Boolean).map(x=>{try{return decodeURIComponent(x)}catch(e){return x}});

  if(host==='tiktok.com'){const a=seg.find(x=>/^@./.test(x));return a?{ch:'틱톡',acct:a,kind:'tt'}:null}
  if(host==='youtube.com'){const a=seg[0]||'';if(a.startsWith('@')&&a.length>1)return {ch:'유튜브',acct:a,kind:'yt',yt:{handle:a.slice(1)}};
    if(a==='channel'&&seg[1])return {ch:'유튜브',acct:null,kind:'yt',yt:{id:seg[1]}};if(a==='user'&&seg[1])return {ch:'유튜브',acct:null,kind:'yt',yt:{user:seg[1]}};if(a==='c'&&seg[1])return {ch:'유튜브',acct:null,kind:'yt',yt:{custom:seg[1]}};return null}
  if(host==='blog.naver.com'){const id=url.searchParams.get('blogId')||(seg[0]&&!/\.naver$/i.test(seg[0])?seg[0]:'');return id?{ch:'네이버 블로그',acct:id,kind:null}:null}
  if(host==='x.com'||host==='twitter.com'){const a=seg[0];return a&&!['home','i','search','explore','intent'].includes(a)?{ch:'엑스',acct:'@'+a,kind:null}:null}
  return null}
function ctypeFromLink(u){const s=String(u||'');
  if(/instagram\.com\/(?:[^/]+\/)?(?:reel|reels|tv)\//i.test(s))return '인스타그램 릴스';if(/instagram\.com\/(?:[^/]+\/)?p\//i.test(s))return '인스타그램 피드';
  if(/youtube\.com\/shorts\//i.test(s))return '유튜브 쇼츠';if(/youtu\.be\/|youtube\.com\/(?:watch|live|embed)/i.test(s))return '유튜브 영상(롱폼)';
  if(/tiktok\.com\//i.test(s))return '틱톡 콘텐츠';if(/blog\.naver\.com\//i.test(s))return '네이버 블로그';if(/(?:x|twitter)\.com\/[^/]+\/status\//i.test(s))return '엑스 콘텐츠';return ''}
/* 링크로 정할 유형 (모호한 경우 기존 값 유지: 인스타 /p/ 는 릴스일 수도, youtu.be 는 쇼츠일 수도 있음) */
function ctypeFor(link,cur){const ct=ctypeFromLink(link);if(!ct||ct===cur)return null;if(ct==='인스타그램 피드'&&cur==='인스타그램 릴스')return null;if(ct==='유튜브 영상(롱폼)'&&cur==='유튜브 쇼츠'&&/youtu\.be\//i.test(link))return null;return ct}

const CAT_RULES=[['뷰티',/beauty|cosmetic|make-?up|skin ?care|hair|nail|attractiveness|뷰티|메이크업|화장품|스킨케어|코스메틱|피부|네일|헤어/i],['패션',/fashion|clothing|apparel|outfit|ootd|패션|코디|룩북|스타일링/i],

function guessCat(d){const sc={};const add=(txt,w)=>{if(!txt)return;CAT_RULES.forEach(([k,re])=>{if(re.test(txt))sc[k]=(sc[k]||0)+(k==='라이프스타일'?w*0.4:w)})};

async function ytProfiles(items){let key=((A.settings||{}).ytKey||'').trim();if(!key)key=(((await loadSettings())||{}).ytKey||'').trim();

async function socialProfiles(urls,prog){let tok='';try{tok=await DB.idToken()}catch(e){}

/* 공동구매·라이브: 다가오는 일정 (3일 전 ~ 3주 뒤) */
function comSchedule(c,rows){const td=today();const GB=isGB(c);const ev=[];
  rows.filter(r=>r.name&&r.stage!==DROP).forEach(r=>{if(GB){if(r.gbStart)ev.push({d:r.gbStart,t:'공구 오픈',r});if(r.gbEnd)ev.push({d:r.gbEnd,t:'공구 마감',r})}else if(r.liveAt)ev.push({d:String(r.liveAt).slice(0,10),tm:String(r.liveAt).slice(11,16),t:'라이브 방송',r,p:r.livePlat})});
  const L=ev.filter(e=>{const x=dd(td,e.d);return x!=null&&x>=-3&&x<=21}).sort((a,b)=>(a.d+(a.tm||'')).localeCompare(b.d+(b.tm||'')));
  const dl=d=>{const x=dd(td,d);return x===0?'<span class="pill crit">D-DAY</span>':x>0?`<span class="pill ${x<=2?'warn':''}">D-${x}</span>`:`<span class="pill">D+${-x}</span>`};
  const none=rows.filter(r=>r.name&&r.stage!==DROP&&!(GB?r.gbStart:r.liveAt)).length;
  return `<section class="panel"><div class="panel-h"><div><h2>${GB?'공구 일정':'방송 일정'}</h2><div class="sub">3일 전부터 3주 뒤까지 · ${GB?'공구 시작일·종료일':'방송 일시'}이 지나면 진행 상황이 자동으로 ${GB?'판매중·판매종료':'방송완료'}로 바뀝니다${none?` · 일정 미입력 ${none}명`:''}</div></div><button class="btn sm" data-act="tab" data-t="grid">진행관리에서 일정 입력</button></div>
   ${L.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>날짜</th><th>일정</th><th>인플루언서</th>${GB?'':'<th>플랫폼</th>'}<th>진행 상황</th><th>확인 필요</th></tr></thead><tbody>${L.map(e=>`<tr class="click" data-act="rowMenu" data-r="${e.r.id}"><td>${dl(e.d)}</td><td style="white-space:nowrap">${md(e.d)}${e.tm?' '+e.tm:''}</td><td class="bold">${e.t}</td><td>${esc(e.r.name)}<span class="small muted"> ${esc(e.r.acct||'')}</span></td>${GB?'':`<td class="small">${esc(e.p||'')}</td>`}<td><span class="pill ${isDone(e.r.stage)?'ok':'accent'}">${esc(e.r.stage||'-')}</span></td><td class="small" style="color:var(--crit)">${esc(alertOf(e.r,c))}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">가까운 일정이 없습니다. 진행관리의 「${GB?'공구 시작일·종료일':'방송 일시'}」 칸을 채우면 여기에 모입니다.</div>`}</section>`}

['trkMode','trkAddBtn','trkDelBtn','trkUpBtn','trkParam','trkSave','trkGen','trkReport','trkToClicks'].forEach(k=>WRITE_ACTS.add(k));
function trkBase(){return DB&&DB.mode==='demo'?location.origin+location.pathname.replace(/[^/]*$/,'')+'l.html?demo=1&c=':'https://ad.ringcoms.com/l/'}
function trkUrl(code){return trkBase()+code}
function trkPrev(code){const u=trkUrl(code);return u+(u.includes('?')?'&':'?')+'preview=1'}
function trkId(){return 'b'+token().slice(0,5)}
function trkDefault(c){return {mode:'bridge',dest:'',utm:true,params:TRK_PARAM0,page:{title:c.brand||c.advertiser||'',sub:'',img:'',color:themeOf(c).acc,btns:[{id:trkId(),label:'브랜드 홈페이지 확인하기',kind:'web',url:'',ios:'',aos:''}]},codes:{}}}

/* 화면에서 고치는 초안 — 「저장」을 눌러야 반영 */
function trkDraft(c){const T=A.trk;const ver=c.track&&c.track.savedAt;if(!T||T.cid!==A.cid||(!T.dirty&&ver&&T.ver!==ver))A.trk={cid:A.cid,d:clone(trkCfg(c)),dirty:false,ver};return A.trk}
function trkBtns(cfg){return cfg.mode==='bridge'?(cfg.page.btns||[]).filter(b=>String(b.label||'').trim()):[]}
function trkSlots(cfg){return cfg.mode==='bridge'?['v','c',...trkBtns(cfg).map(b=>b.id)]:['v']}
function trkParams(cfg,c,code,r){if(cfg.utm===false)return '';return String(cfg.params||'').trim().replace(/^[?&]+/,'').replace(/\{code\}/g,code).replace(/\{name\}/g,encodeURIComponent((r&&(r.acct||r.name))||'')).replace(/\{campaign\}/g,encodeURIComponent(c.name||''))}
function trkLinkDoc(c,cid,cfg,code,r){const lg=c.advLogo&&c.advLogo.length<60000?c.advLogo:'';const p=cfg.page||{};

function trkValidate(d){const ok=u=>/^https?:\/\/\S+$/i.test(String(u||'').trim());
  if(d.mode==='direct')return ok(d.dest)?'':'이동할 주소를 https:// 로 시작하게 입력하세요.';
  if(!String(d.page.title||'').trim())return '브릿지 페이지 제목을 입력하세요.';
  if(d.page.img&&!ok(d.page.img))return '대표 이미지 주소는 https:// 로 시작해야 합니다.';
  const bs=trkBtns(d);if(!bs.length)return '버튼을 1개 이상 만들어 주세요.';
  for(const b of bs){if(b.kind==='app'){if(![b.url,b.ios,b.aos].some(ok))return `「${b.label}」 버튼에 앱 링크를 하나 이상 입력하세요.`;if([b.url,b.ios,b.aos].some(u=>String(u||'').trim()&&!ok(u)))return `「${b.label}」 버튼의 앱 링크는 https:// 로 시작해야 합니다.`}
    else if(!ok(b.url))return `「${b.label}」 버튼의 이동 주소를 https:// 로 시작하게 입력하세요.`}
  return ''}
async function trkNewCode(){for(let i=0;i<6;i++){const k=token().slice(0,6);const ex=await DB.get('links/'+k).catch(()=>null);if(!ex)return k}throw new Error('링크 코드를 만들지 못했습니다.')}

async function trkEnsure(c,cid,code,rid,slots){for(const s of slots){const id=code+'_'+s;if(LSTAT[id])continue;const ex=await DB.get('linkstat/'+id);if(ex){LSTAT[id]=ex;continue}const d={cid,code,rid,slot:s,acct:acctOf(c),n:0,u:0};await DB.set('linkstat/'+id,d);LSTAT[id]=d}}

  const page={title:tr(d.page.title),sub:tr(d.page.sub),img:tr(d.page.img),color:d.page.color||themeOf(c).acc,btns:(d.page.btns||[]).filter(b=>tr(b.label)||tr(b.url)).map(b=>({id:b.id,label:tr(b.label),kind:b.kind==='app'?'app':'web',url:tr(b.url),ios:tr(b.ios),aos:tr(b.aos)}))};
  const cfg={...d,dest:tr(d.dest),utm:d.utm!==false,params:tr(d.params),page,codes:(c.track&&c.track.codes)||{}};

async function trkGenerate(){if(A.trkBusy)return;const cid=A.cid;let c=curC();const T=trkDraft(c);

/* 집계 (어드민·광고주 리포트 공용) */
function trkAgg(c,rows,showNames,admin){const t=c.track;if(!t||!t.codes)return null;const codes=t.codes;const cfg=trkCfg(c);const BR=cfg.mode!=='direct';
  const rs=rows.filter(r=>r.name&&codes[r.id]);if(!rs.length)return null;
  const bs=trkBtns(cfg);const g=(code,s)=>LSTAT[code+'_'+s]||{n:0,u:0};let j=0;
  const T={v:0,u:0,clk:0,cu:0};const B=Object.fromEntries(bs.map(b=>[b.id,{id:b.id,label:b.label,kind:b.kind||'web',n:0,u:0}]));
  const out=rs.map(r=>{const code=codes[r.id];const v=g(code,'v'),cc=BR?g(code,'c'):v;
    const o={rid:r.id,name:showNames?r.name:`인플루언서 ${++j}`,group:groupName(c,r.group)||'',v:n(v.n),u:n(v.u),clk:n(cc.n),cu:n(cc.u),b:{}};if(admin)o.code=code;
    if(BR){o.clk=0;bs.forEach(b=>{const x=g(code,b.id);o.b[b.id]=n(x.n);o.clk+=n(x.n);B[b.id].n+=n(x.n);B[b.id].u+=n(x.u)})}
    o.ctr=BR&&o.u?Math.min(1,o.cu/o.u):null;T.v+=o.v;T.u+=o.u;T.clk+=o.clk;T.cu+=o.cu;return o}).sort((a,b)=>b.clk-a.clk||b.v-a.v);
  T.ctr=BR&&T.u?Math.min(1,T.cu/T.u):null;
  return {mode:BR?'bridge':'direct',T,btns:Object.values(B),rows:out}}

function importRows(P){
  const c=curC();const cur=curRows();const upd={};let add=0,up=0;const gByName={};groupsOf(c).forEach(g=>gByName[g.name]=g.id);let gOrder=groupsOf(c).length;let order=cur.reduce((t,r)=>Math.max(t,r.order||0),0);
  const numK=['fol','offer','fee','use','ops','ad','views','likes','cmts','shares','saves','reach','clicks','conv','rev','qty','viewers','peak','chats','liveMin','rate'];const dateK=['lastc','due','up','upd','gbStart','gbEnd'];const chIds=[],perfIds=[];const SL=stagesOf(c);const COM=isCom(c);
  P.rows.forEach(o=>{
    const v={};for(const k in o){if(k==='tier')continue;if(numK.includes(k)){const x=parseNum(o[k]);if(x!=null)v[k]=x}else if(dateK.includes(k)){const x=normDate(o[k]);if(x)v[k]=x}else v[k]=o[k]}
    if(v.ch){const raw=v.ch;v.ch=normCh(raw);if(!v.ctype&&!CHANNELS.includes(raw))v.ctype=guessType(v.ch,raw)||undefined;if(!v.ctype)delete v.ctype}
    let chp=null;if(v.chlink){chp=parseChLink(v.chlink);if(chp){v.ch=chp.ch;if(chp.acct)v.acct=chp.acct}}
    if(v.clink){const ct=ctypeFor(v.clink,v.ctype);if(ct)v.ctype=ct}
    if(v.stage)v.stage=normStage(String(v.stage).trim());
    if(v.stage&&![...SL,DROP].includes(v.stage))v.stage=SL.find(s=>s.replace(/\s/g,'')===v.stage.replace(/\s/g,''))||v.stage;
    if(v.liveAt){const x=normDT(v.liveAt);if(x)v.liveAt=x;else delete v.liveAt}
    if(v.livePlat){const s=String(v.livePlat).replace(/\s/g,'');v.livePlat=LIVE_PLATS.find(p=>p.replace(/\s/g,'')===s)||LIVE_PLATS.find(p=>s&&(p.replace(/\s/g,'').includes(s)||s.includes(p.replace(/\s/g,'').slice(0,3))))||v.livePlat}
    ['contract','disc'].forEach(k=>{if(v[k]){const s=String(v[k]).toLowerCase();v[k]=/완료|o|y|true|✓/.test(s)&&!/미완료/.test(s)?'완료':'미완료'}});
    ['ship','lic'].forEach(k=>{if(v[k]!=null&&v[k]!==''){const s=String(v[k]).toLowerCase();if(/완료|동의|o|y|true|✓/.test(s)&&!/미완료|미동의/.test(s))v[k]='완료';else delete v[k]}});
    if(!v.stage&&v.clink&&!COM)v.stage=DONE;
    if(v.partner)v.partner=normPartner(v.partner);
    if(v.group){const nm=String(v.group).trim();if(!gByName[nm]){const gid='g'+uid();gByName[nm]=gid;upd[`groups.${gid}`]={name:nm,order:++gOrder,createdAt:today()}}v.group=gByName[nm]}else if(A.gf&&A.gf!=='__none')v.group=A.gf;
    const na=s=>String(s||'').trim().toLowerCase().replace(/^@/,'');
    const hit=cur.find(r=>v.gbCode&&r.gbCode&&String(r.gbCode).trim().toLowerCase()===String(v.gbCode).trim().toLowerCase())||cur.find(r=>v.clink&&r.clink&&r.clink.split('?')[0]===v.clink.split('?')[0])||cur.find(r=>v.name&&r.name===v.name&&(!v.acct||r.acct===v.acct)&&(!v.ctype||!r.ctype||r.ctype===v.ctype))||cur.find(r=>!v.name&&v.acct&&r.acct&&na(r.acct)===na(v.acct));
    const autoPerf=v.clink&&(ytId(v.clink)||/instagram\.com|tiktok\.com/.test(v.clink));
    if(hit){for(const k in v)if(!(k==='name'&&!v.name))upd[`rows.${hit.id}.${k}`]=v[k];up++;if(chp&&chp.kind)chIds.push(hit.id);if(autoPerf&&hit.clink!==v.clink)perfIds.push(hit.id)}
    else{if(!v.name)return;order++;const id=uid();upd[`rows.${id}`]={order,createdAt:today(),contract:'미완료',disc:'미완료',...(isLive(c)&&c.com&&c.com.plat&&!v.livePlat?{livePlat:c.com.plat}:{}),...v};add++;if(chp&&chp.kind)chIds.push(id);if(autoPerf)perfIds.push(id)}
  });
  if(!add&&!up)return toast('가져올 행이 없습니다.');
  const gUp={};for(const k in upd)if(k.startsWith('groups.')){gUp[k]=upd[k];delete upd[k]}
  (Object.keys(gUp).length?DB.update('campaigns/'+A.cid,gUp):Promise.resolve()).then(()=>DB.update('rows/'+A.cid,upd)).then(()=>{toast(`${add}행 추가 · ${up}행 업데이트${Object.keys(gUp).length?` · 새 그룹 ${Object.keys(gUp).length}개`:''}${chIds.length?` · 채널 정보 ${chIds.length}명은 잠시 뒤 채워집니다`:''}${perfIds.length?` · 새 콘텐츠 ${perfIds.length}개의 업로드일·성과를 불러옵니다`:''}`);scheduleSync(A.cid);if(chIds.length)queueProfiles(A.cid,chIds);if(perfIds.length&&canEdit())queuePerf(A.cid,perfIds)}).catch(saveErr);
}

  if(f==='name'&&!v){toast('이름은 비울 수 없습니다.','crit');return}up[f]=v;if(['name','fol','cat','contact','chlink','email'].includes(f))up.manual=true;DB.update('pool/'+t.dataset.p,up).catch(saveErr)});
</script>
<script type="text/plain" id="rules-src">
rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() {
      return request.auth != null && request.auth.token.email_verified == true;
    }
    function me() {
      return /databases/$(database)/documents/admins/$(request.auth.token.email.lower());
    }
    // 등록된 사람 (링컴즈 팀원 + 초대받은 광고주)
    function isAdmin() {
      return signedIn() && exists(me());
    }
    // 권한: 기록이 없으면 뷰어로 취급 / 계정: 기록이 없으면 링컴즈(ringcoms)
    function role() {
      return get(me()).data.get('role', 'viewer');
    }
    function acct() {
      return get(me()).data.get('acct', 'ringcoms');
    }
    // 링컴즈 팀원 (마스터·매니저·뷰어)
    function isTeam() {
      return isAdmin() && acct() == 'ringcoms' && role() in ['master', 'manager', 'viewer'];
    }
    // 수정 가능: 링컴즈 마스터·매니저
    function canEdit() {
      return isTeam() && role() in ['master', 'manager'];
    }
    function isMaster() {
      return isTeam() && role() == 'master';
    }
    // 광고주 계정 사람 (클라이언트·클라이언트 관리자)
    function isClient() {
      return isAdmin() && acct() != 'ringcoms' && role() in ['client', 'clientAdmin'];
    }
    function isClientAdmin() {
      return isClient() && role() == 'clientAdmin';
    }
    function camp(id) {
      return get(/databases/$(database)/documents/campaigns/$(id)).data;
    }
    // 광고주 관리자가 자기 계정에서 직접 운영하는 캠페인 (링컴즈가 운영하는 캠페인은 제외)
    function ownData(d) {
      return d.acct == acct() && d.managed == '';
    }
    function ownsCamp(id) {
      return isClientAdmin() && exists(/databases/$(database)/documents/campaigns/$(id))
        && camp(id).get('acct', 'ringcoms') == acct() && camp(id).get('managed', 'ringcoms') == '';
    }

    // 사람 목록: 팀원은 전체, 광고주는 자기 문서(관리자는 같은 계정 멤버)만
    // 추가는 마스터·매니저 (매니저는 마스터를 만들 수 없음) · 팀원 권한은 ringcoms 계정에만, 광고주 권한은 광고주 계정에만
    match /admins/{email} {
      allow get: if isTeam() || (isAdmin() && email == request.auth.token.email.lower())
        || (isClientAdmin() && resource.data.acct == acct());
      allow list: if isTeam() || (isClientAdmin() && resource.data.acct == acct());
      allow create: if canEdit()
        && (isMaster() || request.resource.data.role in ['manager', 'viewer', 'client', 'clientAdmin'])
        && ((request.resource.data.get('acct', 'ringcoms') == 'ringcoms') == (request.resource.data.role in ['master', 'manager', 'viewer']));
      allow update: if isMaster()
        && ((request.resource.data.get('acct', 'ringcoms') == 'ringcoms') == (request.resource.data.role in ['master', 'manager', 'viewer']));
      allow delete: if (isMaster() && email != request.auth.token.email.lower())
        || (canEdit() && resource.data.get('acct', 'ringcoms') != 'ringcoms');
    }
    // 광고주 계정: 팀원 읽기·마스터·매니저 수정, 광고주는 자기 계정만 읽기
    match /accounts/{aid} {
      allow read: if isTeam() || (isClient() && aid == acct());
      allow write: if canEdit();
    }
    // 캠페인: 팀원 읽기·마스터·매니저 수정 / 광고주 관리자는 자기 계정에서 직접 운영하는 캠페인만
    match /campaigns/{id} {
      allow read: if isTeam() || (isClientAdmin() && ownData(resource.data));
      allow create: if canEdit() || (isClientAdmin() && ownData(request.resource.data));
      allow update: if canEdit() || (isClientAdmin() && ownData(resource.data) && ownData(request.resource.data));
      allow delete: if canEdit() || (isClientAdmin() && ownData(resource.data));
    }
    match /rows/{id} {
      allow read: if isTeam() || ownsCamp(id);
      allow write: if canEdit() || ownsCamp(id);
    }
    // 썸네일(직접 넣은 이미지)
    match /thumbs/{id} {
      allow read: if isTeam() || ownsCamp(id);
      allow write: if canEdit() || ownsCamp(id);
    }
    // 인플루언서 풀: 링컴즈 팀원만
    match /pool/{id} {
      allow read: if isTeam();
      allow write: if canEdit();
    }
    // 광고주 공유용 썸네일·공유본: 링크(토큰)를 아는 사람만 한 건씩 읽기, 목록 조회 불가
    match /sharethumbs/{token} {
      allow get: if true;
      allow list: if false;
      allow create, update: if canEdit() || (isClientAdmin() && request.resource.data.get('acct', '') == acct() && (resource == null || resource.data.get('acct', '') == acct()));
      allow delete: if canEdit() || (isClientAdmin() && resource.data.get('acct', '') == acct());
    }
    match /shares/{token} {
      allow get: if true;
      allow list: if false;
      allow create, update: if canEdit() || (isClientAdmin() && request.resource.data.get('acct', '') == acct() && (resource == null || resource.data.get('acct', '') == acct()));
      allow delete: if canEdit() || (isClientAdmin() && resource.data.get('acct', '') == acct());
    }
    // 클라이언트 공개용 진행 현황 (비용·연락처·주소 없음): 같은 계정 광고주만 읽기
    match /cview/{cid} {
      allow read: if isTeam() || (isClient() && resource.data.acct == acct());
      allow write: if canEdit() || ownsCamp(cid);
    }
    // 광고주 컨펌 (인플루언서 진행 여부): 같은 계정 광고주가 쓰고, 팀원이 읽음
    match /cconfirm/{cid} {
      allow read: if isTeam() || (isClient() && resource.data.acct == acct());
      allow create: if canEdit() || (isClient() && request.resource.data.get('acct', '') == acct()
        && exists(/databases/$(database)/documents/campaigns/$(cid)) && camp(cid).get('acct', 'ringcoms') == acct());
      allow update: if canEdit() || (isClient() && resource.data.get('acct', '') == acct() && request.resource.data.get('acct', '') == acct());
      allow delete: if canEdit();
    }
    // 연동 설정(유튜브 API 키 등): 팀원·광고주 관리자 읽기, 마스터만 수정
    match /settings/{id} {
      allow read: if isTeam() || isClientAdmin();
      allow write: if isMaster();
    }
    // 프로필 이미지 등 공개 정보: 누구나 한 건씩 읽기, 마스터·매니저만 수정
    match /public/{id} {
      allow get: if true;
      allow list: if false;
      allow write: if canEdit();
    }
  }
}
</script>
