<style>
:root{
  --bg:#F2F4F7;--surface:#FFFFFF;--surface2:#F7F8FA;--line:#E0E4EA;--line2:#C9CFD9;
  --ink:#131822;--ink2:#394253;--muted:#687184;
  --accent:#2347D4;--accent-ink:#FFFFFF;--accent-soft:#E6EBFC;
  --ok:#157A3C;--ok-soft:#E2F3E8;--warn:#A95205;--warn-soft:#FCEFDD;--crit:#C22727;--crit-soft:#FBE6E6;
  --shadow:0 1px 2px rgba(19,24,34,.05),0 8px 28px rgba(19,24,34,.08);
  --font:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --bg:#0D1016;--surface:#151921;--surface2:#1A1F28;--line:#282E3A;--line2:#384151;--ink:#E8EBF1;--ink2:#C2C8D4;--muted:#8C95A7;
  --accent:#7D96FF;--accent-ink:#0D1016;--accent-soft:#1D2641;--ok:#56C987;--ok-soft:#132A1D;--warn:#F0A53A;--warn-soft:#2D2313;--crit:#F27474;--crit-soft:#321A1D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.01em;text-wrap:balance}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-inline:24px}
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15}
.top .wrap{display:flex;align-items:center;gap:18px;height:58px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{display:block;font-size:14px;letter-spacing:.03em}
.brand span{display:block;font-size:11.5px;color:var(--muted)}
.nav{display:flex;gap:2px}
.nav button{all:unset;cursor:pointer;padding:7px 12px;border-radius:8px;color:var(--ink2);font-weight:500}
.nav button:hover{background:var(--surface2)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.who{margin-left:auto;display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;font-size:12.5px;color:var(--muted)}
main{padding-block:26px 90px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:22px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid2>*{min-width:0}
.thbtn{padding:2px 7px!important;font-size:11px!important;margin-left:4px}
.thlist{display:flex;flex-direction:column;gap:8px}.thitem{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.thitem.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.thitem .prev{width:48px;height:60px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);overflow:hidden;flex:none}.thitem .prev img{width:100%;height:100%;object-fit:cover}
.rpgo{white-space:nowrap;color:var(--accent);font-weight:600}
.rtool{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}.rtool .rg{display:flex;flex-direction:column;gap:7px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.rtool .rl{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.print-only{display:none}
.pcover,.peod{flex-direction:column;justify-content:center;gap:14px;height:182mm;padding:18mm;border-radius:0;background:var(--th-bg,#161B26);color:var(--th-ink,#fff);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pcover{break-after:page}.peod{break-before:page;align-items:center;text-align:center}
.pcover .pb{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.04em}.pcover .pb img{width:34px;height:34px;border-radius:50%}
.pcover .pe{font-size:12px;letter-spacing:.18em;opacity:.7;margin-top:auto}.pcover .pt{font-size:34px;font-weight:700;line-height:1.25}.pcover .pm{font-size:13px;opacity:.8;display:flex;flex-wrap:wrap;gap:6px 18px}.pcover .pf{margin-top:auto;font-size:11px;opacity:.6}
.peod .eod{font-size:64px;font-weight:700;letter-spacing:.12em}.peod .et{font-size:15px;font-weight:600}.peod .em{font-size:13px;opacity:.8}
.mchk{display:flex;flex-wrap:wrap;gap:8px}.mchk label{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;cursor:pointer;background:var(--surface)}.mchk label.off{color:var(--muted);background:var(--surface2);text-decoration:line-through}
.cmp{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.cmp i{display:inline-block;height:6px;border-radius:3px;background:var(--accent);min-width:2px}
.tcalc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}.tcalc div{background:var(--surface2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}.tcalc span{font-size:11.5px;color:var(--muted)}.tcalc b{font-size:16px;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}

async function boot(){
  const params=new URLSearchParams(location.search);const r=params.get('r');
  const demo=!CONFIGURED;
  if(demo&&!r){let on=false;try{on=sessionStorage.getItem('ring_demo')==='1'}catch(e){}if(!on&&!params.has('demo')){renderSetup();return}try{sessionStorage.setItem('ring_demo','1')}catch(e){}}
  try{DB=demo?demoStore():await firebaseStore()}catch(e){document.getElementById('app').innerHTML=`<div class="center"><div class="card"><h2>서버에 연결하지 못했습니다</h2><p class="sub">인터넷 연결을 확인하고 새로고침하세요.</p></div></div>`;return}
  if(r){startShare(r);return}
  DB.onAuth(async u=>{
    A.user=u;A.admin=false;
    if(!u){render();return}
    try{const a=await DB.get('admins/'+u.email);A.admin=!!a;A.role=a?(a.role||(DB.mode==='demo'?'master':'viewer')):null}catch(e){A.admin=false}
    if(A.admin){DB.watchCol('campaigns',m=>{A.campaigns=m;scheduleRender()},e=>{A.err='캠페인을 불러오지 못했습니다.';render()});DB.watchCol('admins',m=>{A.admins=m;const me=m[A.user.email];if(me)A.role=me.role||(DB.mode==='demo'?'master':'viewer');else if(DB.mode!=='demo'){A.admin=false}scheduleRender()},()=>{});watchSettings();DB.watchCol('pool',m=>{A.pool=m;A.poolLoaded=true;if(A.view==='pool'||(A.drawer&&A.drawer.type==='pool'))scheduleRender()},()=>{})}
    render();
  });
}

function render(){

  const sc=[...document.querySelectorAll('[data-keep-scroll]')].map(e=>[e.dataset.keepScroll,e.scrollLeft,e.scrollTop]);
  const ds=$('.drawer-b')?$('.drawer-b').scrollTop:0;

  A._r=true;try{app.innerHTML=html}finally{A._r=false}
  applyReadOnly();
  sc.forEach(([k,l,t])=>{const e=document.querySelector(`[data-keep-scroll="${k}"]`);if(e){e.scrollLeft=l;e.scrollTop=t}});
  if($('.drawer-b'))$('.drawer-b').scrollTop=ds;
  if(keep){const el=document.getElementById(keep.id);if(el){if(keep.tag!=='SELECT'&&keep.t!=='checkbox'&&keep.t!=='date')el.value=keep.v;el.focus({preventScroll:true});try{if(keep.s!=null)el.setSelectionRange(keep.s,keep.e)}catch(e){}}}
}

/* ============ 캠페인 목록 ============ */
function viewList(){
  const q=A.q.trim().toLowerCase();
  const kind=listKind(),TRL=kind==='trial';
  const all=Object.entries(A.campaigns).filter(([,c])=>kindOf(c)===kind).sort((a,b)=>String(b[1].createdAt).localeCompare(String(a[1].createdAt)));
  [...A.csel].forEach(id=>{if(!A.campaigns[id]||kindOf(A.campaigns[id])!==kind)A.csel.delete(id)});
  const tabs=`<div class="ltabs" role="tablist"><button role="tab" class="${A.ltab!=='groups'?'on':''}" data-act="ltab" data-k="camps">캠페인<em>${all.length}</em></button><button role="tab" class="${A.ltab==='groups'?'on':''}" data-act="ltab" data-k="groups">광고 그룹<em>${A.csel.size?'선택 '+A.csel.size+'개 캠페인':'전체 캠페인'}</em></button></div>`;
  const head=`<div class="page-h"><div><div class="eyebrow">${TRL?'Product Trial Campaigns':'Seeding Campaigns'}</div><h1>${TRL?'체험단 캠페인':'시딩 캠페인'}</h1>${TRL?'<div class="sub">무상협찬(제품 제공)으로만 진행하는 인플루언서 캠페인입니다. 대행수수료·단가 없이 제품 판매단가와 신청 데이터를 관리합니다.</div>':''}</div><button class="btn primary" data-act="newCampaign">+ ${TRL?'새 체험단 캠페인':'새 캠페인'}</button></div>${tabs}`;
  if(A.ltab==='groups')return head+viewGroupList(all,TRL);
  const cnt={};STATUS_LIST.forEach(s=>cnt[s]=all.filter(([,c])=>campStatus(c)===s).length);
  const list=all.filter(([,c])=>(!A.statusF||campStatus(c)===A.statusF)&&(!q||[c.name,c.advertiser,c.brand,c.owner,c.trial&&c.trial.product,c.trial&&c.trial.cat].join(' ').toLowerCase().includes(q)));
  const tot=list.reduce((t,[,c])=>{const s=c.summary||{};t.cost+=n(s.cost);t.views+=n(s.views);if(TRL)t.val+=n(trialCalc(c).totalValue);return t},{cost:0,views:0,val:0});
  const allOn=list.length&&list.every(([id])=>A.csel.has(id));
  if(TRL)return head+trialInsight(all)+viewTrialList(all,list,tot,cnt,q,allOn);
  return head+`
  <div class="row" style="margin-bottom:14px"><div class="chips">${[['','전체',all.length],...STATUS_LIST.map(s=>[s,s,cnt[s]])].map(([k,l,c])=>`<span class="chip ${A.statusF===k?'on':''}" data-act="statusF" data-k="${k}">${l} <em>${c}</em></span>`).join('')}</div><span class="grow"></span><span class="sub">광고비 합계 ${fmt(tot.cost)}원 (VAT 별도) · 조회 ${compact(tot.views)}</span><input type="text" id="q" data-ui="q" value="${esc(A.q)}" placeholder="캠페인·광고주·담당자 검색" style="max-width:240px"></div>
  ${A.csel.size?`<div class="panel row" style="padding:10px 14px;margin-bottom:12px"><b>${A.csel.size}개 캠페인 선택</b><span class="small muted">선택한 캠페인의 광고 그룹만 모아서 볼 수 있습니다</span><span class="grow"></span><button class="btn sm primary" data-act="ltab" data-k="groups">선택 캠페인 그룹 보기 →</button><button class="btn sm ghost" data-act="cselClear">선택 해제</button></div>`:''}
  ${list.length?`${mCampCards(list)}<div class="tblwrap hide-m"><table class="tbl"><thead><tr><th style="width:34px"><input type="checkbox" data-act="cselAll" aria-label="전체 선택" ${allOn?'checked':''}></th><th>캠페인</th><th>목적</th><th>상태</th><th>기간</th><th class="n">그룹</th><th style="min-width:160px">진행 단계</th><th class="n">업로드</th><th class="n">광고비<br><span class="small muted" style="font-weight:400">VAT 별도</span></th><th class="n">조회수</th><th class="n">ER</th><th class="n">CPV</th><th class="n">확인 필요</th><th>광고주 링크</th><th style="width:1%">리포트</th></tr></thead><tbody>
  ${list.map(([id,c])=>{const s=c.summary||{};const st=campStatus(c);const gs=groupsOf(c);return `<tr class="click ${A.csel.has(id)?'sel':''}" data-act="open" data-id="${id}"><td><input type="checkbox" data-act="csel" data-id="${id}" aria-label="선택" ${A.csel.has(id)?'checked':''}></td><td class="nm">${isEditing('c',id)?nameEdit('c',id,'',c.name||''):`<b>${nameEdit('c',id,'',c.name||'',esc(c.name||'이름 없음'))}</b>`}<span>${esc(c.advertiser||'광고주 미입력')}${c.owner?' · '+esc(c.owner):''}</span></td>
  <td><span class="pill accent">${esc(c.objective||'-')}</span></td><td><span class="pill ${STATUS_CLS[st]||''}">${esc(st)}</span></td><td class="small">${c.start?md(c.start)+' ~ '+md(c.end):'–'}</td><td class="n">${gs.length?`<a class="glink" href="#" data-act="showGroups" data-id="${id}" title="이 캠페인의 그룹 보기">${gs.length}</a>`:'–'}</td>
  <td>${stageBar(s.stages||{},s.n||0,false)}</td><td class="n">${s.uploaded||0}/${s.n||0}</td><td class="n">${fmt(s.cost||0)}</td><td class="n">${compact(s.views||0)}</td><td class="n">${pct(s.er)}</td><td class="n">${fmt1(s.cpv)}</td><td class="n">${s.alerts?`<span class="pill crit">${s.alerts}</span>`:'<span class="muted">0</span>'}</td><td>${c.share&&c.share.enabled?'<span class="pill ok">공유 중</span>':'<span class="muted small">꺼짐</span>'}</td><td><button class="btn sm rpgo" data-act="openReport" data-id="${id}" title="이 캠페인의 성과 리포트로 바로 가기">성과 리포트 →</button></td></tr>`}).join('')}</tbody></table></div>`:`<div class="panel empty">${all.length?'조건에 맞는 캠페인이 없습니다.':'아직 캠페인이 없습니다. 「새 캠페인」으로 시작하세요.'}</div>`}`;
}

function calcTotals(c,list){const t={};const ks=['fol','offer','fee','use','ops','ad','views','likes','cmts','shares','saves','reach','clicks','conv','rev'];ks.forEach(k=>t[k]=list.reduce((s,r)=>s+n(r[k]),0));
  const live=list.filter(r=>r.stage!==DROP);t.cost=live.reduce((s,r)=>s+n(rowCalc(r,c).cost),0);t.cost0=live.reduce((s,r)=>s+n(rowCalc(r,c).cost0),0);t.agf=live.reduce((s,r)=>s+n(rowCalc(r,c).agf),0);t.eng=live.reduce((s,r)=>s+n(rowCalc(r,c).eng),0);t.er=t.views?t.eng/t.views:null;
  const cv=live.filter(r=>n(r.views)>0).reduce((s,r)=>s+n(rowCalc(r,c).cost),0);t.cpv=t.views&&cv?cv/t.views:null;t.cpe=t.eng&&t.cost?t.cost/t.eng:null;t.ctr=t.views&&t.clicks?t.clicks/t.views:null;t.cvr=t.clicks&&t.conv?t.conv/t.clicks:null;t.cpa=t.conv&&t.cost?t.cost/t.conv:null;t.roas=t.cost&&t.rev?t.rev/t.cost:null;
  Object.keys(t).forEach(k=>{if(!t[k])t[k]=null});return t}

    else ctl=`<input id="${id}" type="${type==='num'||type==='pct'?'text':type||'text'}" ${type==='num'||type==='pct'?'inputmode="decimal"':''} data-cf="${path}" data-t="${type||'text'}" value="${esc(type==='pct'&&has(val)?+(val*100).toFixed(2):type==='num'&&has(val)?Number(val).toLocaleString('ko-KR'):val??'')}">`;

  return `<div class="stack">
  <section class="panel"><div class="panel-h"><h2>기본 정보</h2></div><div class="fgrid">
   ${fld('name','캠페인명',c.name)}${fld('advertiser','광고주',c.advertiser)}<div class="f" style="display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--ink2)">광고주 로고<div class="row">${c.advLogo?`<img class="advprev" src="${esc(c.advLogo)}" alt="">`:''}<label class="btn sm" style="cursor:pointer">${c.advLogo?'변경':'이미지 선택'}<input type="file" accept="image/*" data-advlogo hidden></label>${c.advLogo?'<button class="btn sm danger" data-act="advLogoDel">삭제</button>':''}</div><span class="hint" style="font-weight:400;color:var(--muted);font-size:11.5px">리포트 상단에 RINGCOMS × 광고주 로고로 표시 (배경 없는 PNG 권장)</span></div>${fld('brand','브랜드명',c.brand)}<label class="f">캠페인 구분<select id="s_kind" data-cf="kind"><option value="seed" ${!TRL?'selected':''}>시딩 캠페인</option><option value="trial" ${TRL?'selected':''}>체험단 캠페인 (무상협찬)</option></select><span class="hint">바꾸면 해당 메뉴 목록으로 옮겨집니다${TRL?'':' · 체험단은 비용 항목 없이 관리'}</span></label>${TRL?'':fld('ctype','캠페인 유형',c.ctype,null,'',CAMP_TYPES)}
   <label class="f">상태<select id="s_status" data-cf="status"><option value="" ${c.status!=='보류'&&c.status!=='종료'?'selected':''}>자동 판정 (현재: ${esc(c.summary&&c.summary.status||'시작 전')})</option><option ${c.status==='보류'?'selected':''}>보류</option><option ${c.status==='종료'?'selected':''}>종료</option></select><span class="hint">진행 상황에 따라 시작 전·진행 중·완료가 자동으로 바뀝니다</span></label>${fld('start','시작일',c.start,'date')}${fld('end','종료일',c.end,'date')}${fld('owner','담당자',c.owner)}
   ${TRL&&c.objective!=='2차 라이선스 활용'?'':fld('usageMonths','2차 활용 기간 (개월)',c.usageMonths,'num')}${fld('asof','데이터 기준일',c.asof,'date','리포트에 표시되는 성과 수집 기준일 (예: 업로드 후 D+7)')}</div></section>
  ${TRL?trialSettings(c,fld):''}${groupSettings(c)}
  <section class="panel"><div class="panel-h"><h2>캠페인 목적</h2><span class="sub">목적에 따라 리포트 상단의 핵심 지표가 바뀝니다</span></div>
   <div class="objs">${(TRL?OBJ_TRIAL:OBJECTIVES).map(o=>`<button class="obj ${c.objective===o.k?'on':''}" data-act="objective" data-k="${o.k}"><b>${o.k}</b><span>${o.d}</span></button>`).join('')}</div>
   ${c.objective==='전환'?`<div class="fgrid" style="margin-top:14px">${fld('convType','전환 유형',c.convType,null,'리포트에서 전환 명칭으로 쓰입니다 (구매 / 앱 설치 / 가입)',CONV_TYPES)}</div>`:''}
   <div class="hr" style="margin:16px 0 8px"></div><div class="sec-t small bold muted">유입·전환 데이터 입력 (선택)</div>
   ${tg('metrics.clicks','링크 클릭 (유입)',M.clicks,'트래킹 링크 클릭 수 입력 · 리포트에 CTR·CPC 표시')}
   ${tg('metrics.conv',`전환 수 (${CONV_LABEL[c.convType]||'전환'})`,M.conv,'구매 건수·앱 설치 수 등 입력 · CVR·CPA 표시')}
   ${tg('metrics.revenue','매출액',M.revenue,'프로모코드·광고주 데이터 기준 매출 입력 · 매출·ROAS 표시')}</section>
  <section class="panel"><div class="panel-h"><h2>목표 KPI</h2><span class="sub">입력한 목표만 리포트에 달성률로 표시됩니다</span></div><div class="fgrid">
   ${TRL?fld('targets.applicants','목표 신청자 수',t.applicants,'num','리포트에 신청자 달성률로 표시'):''}${fld('targets.contents','목표 콘텐츠 수',t.contents,'num')}${fld('targets.views','목표 총 조회수',t.views,'num')}${fld('targets.reach','목표 총 도달',t.reach,'num')}${fld('targets.er','목표 ER (%)',t.er,'pct','5 입력 시 5%')}
   ${TRL?'':fld('targets.cpv','목표 CPV (원)',t.cpv,'num','이하 달성')}${M.clicks?fld('targets.clicks','목표 링크 클릭',t.clicks,'num'):''}${M.conv?fld('targets.conv',`목표 ${CONV_LABEL[c.convType]||'전환'} 수`,t.conv,'num'):''}${M.conv&&!TRL?fld('targets.cpa','목표 CPA (원)',t.cpa,'num','이하 달성'):''}
   ${M.revenue?fld('targets.revenue','목표 매출 (원)',t.revenue,'num'):''}${M.revenue&&!TRL?fld('targets.roas','목표 ROAS (%)',t.roas,'pct','200 입력 시 200%'):''}${TRL?'':fld('targets.budget','총 예산 (원)',t.budget,'num','광고주에게는 표시되지 않음')}</div></section>
  <div class="${TRL?'':'grid2'}"><section class="panel"><div class="panel-h"><h2>인게이지먼트 집계 항목</h2></div><p class="small muted" style="margin-top:0">선택한 항목의 합이 인게이지먼트가 되고 ER·CPE 계산에 쓰입니다.</p>
   ${tg('eng.likes','좋아요 수',E.likes)}${tg('eng.cmts','댓글 수',E.cmts)}${tg('eng.shares','공유 수',E.shares)}${tg('eng.saves','저장 수',E.saves)}</section>
  ${TRL?'':`<section class="panel"><div class="panel-h"><h2>집행 비용 집계 항목</h2></div><p class="small muted" style="margin-top:0">선택한 항목의 합이 집행 비용이 되고 CPV·CPE·CPA·ROAS 계산에 쓰입니다.</p>
   ${tg('costInc.fee','원고료',K.fee)}${tg('costInc.use','2차 활용비',K.use)}${tg('costInc.ops','운영비',K.ops,'제품비·배송비 등')}${tg('costInc.ad','광고 집행비',K.ad,'부스팅 등 매체비. 콘텐츠 자체 효율만 볼 때는 끄세요')}
   <div class="hr" style="margin:14px 0 10px"></div><div class="fgrid"><label class="f">대행수수료율 (%)<input id="s_agencyRate" type="text" inputmode="decimal" data-cf="agencyRate" data-t="num" value="${feeRate(c)}"><span class="hint">기본 20%. 수수료가 없으면 0 입력</span></label>
   <div class="f">어드민 화면 광고비 기준${feeSwitch(c)}<span class="hint">광고비 = 집행 비용 + 대행수수료(${feeRate(c)}%) · CPV·CPE·CPA·ROAS도 이 기준으로 계산</span></div></div></section>`}</div>
  ${A.view==='create'?'':`<section class="panel"><div class="panel-h"><h2>캠페인 관리</h2></div><div class="row"><button class="btn" data-act="duplicate">설정 복제해서 새 캠페인 만들기</button><span class="grow"></span><button class="btn danger" data-act="delCampaign">${A.confirm==='delc'?'한 번 더 누르면 영구 삭제':'캠페인 삭제'}</button></div></section>`}

/* ============ 유튜브 성과 불러오기 (YouTube Data API v3) ============ */
function ytRows(rows){return rows.filter(r=>r.name&&r.stage!==DROP&&ytId(r.clink))}
function socialRows(rows){return rows.filter(r=>r.name&&r.stage!==DROP&&/instagram\.com|tiktok\.com/.test(r.clink||''))}
function socialInfo(rows){const s=socialRows(rows);if(!s.length)return '';const last=s.map(r=>r.socialAt||'').sort().pop();return `인스타그램·틱톡 ${s.length}개${last?` · 최근 업데이트 ${fmtDT(last).replace(/<[^>]+>/g,'')}`:' · 아직 불러오기 전'}`}

/* 유튜브: YouTube Data API로 바로 */
async function ytUpdate(cid,rows){let key=((A.settings||{}).ytKey||'').trim();if(!key)key=(((await loadSettings())||{}).ytKey||'').trim();
  if(!key)throw new Error('YouTube API 키가 연결되지 않았습니다. 권한 관리 → 연동 관리에서 마스터가 키를 넣어 주세요.');
  const ids=[...new Set(rows.map(r=>ytId(r.clink)))];const stat={};
  for(let i=0;i<ids.length;i+=50){const u='https://www.googleapis.com/youtube/v3/videos?part=statistics&id='+ids.slice(i,i+50).join(',')+'&key='+encodeURIComponent(key);
    const res=await fetch(u);const j=await res.json().catch(()=>({}));
    if(!res.ok||j.error){const rs=((j.error&&j.error.errors)||[])[0]||{};const why=rs.reason||'';throw new Error(/quota/i.test(why)?'오늘 사용할 수 있는 YouTube API 한도를 다 썼습니다. 내일 다시 시도하세요.':/keyInvalid|badRequest/i.test(why)||/API key not valid/i.test((j.error||{}).message||'')?'API 키가 올바르지 않습니다. 권한 관리 → 연동 관리에서 키를 확인하세요.':/referer|blocked|forbidden/i.test(why+' '+((j.error||{}).message||''))?'API 키의 웹사이트 제한에 이 사이트 주소('+location.host+'/*)가 없습니다. Google Cloud의 키 설정에 추가해 주세요.':/accessNotConfigured|disabled/i.test(why)?'Google Cloud 프로젝트에서 YouTube Data API v3를 사용 설정해 주세요.':'YouTube에서 데이터를 받지 못했습니다. ('+(why||res.status)+')')}
    (j.items||[]).forEach(it=>stat[it.id]=it.statistics||{})}
  const up={};let ok=0;const miss=[];const now=new Date().toISOString();
  rows.forEach(r=>{const s=stat[ytId(r.clink)];if(!s){miss.push(r.name);return}const b=`rows.${r.id}.`;if(s.viewCount!=null)up[b+'views']=+s.viewCount;if(s.likeCount!=null)up[b+'likes']=+s.likeCount;if(s.commentCount!=null)up[b+'cmts']=+s.commentCount;up[b+'upd']=today();up[b+'ytAt']=now;ok++});
  if(Object.keys(up).length)await DB.update('rows/'+cid,up);scheduleSync(cid);return {ok,miss}}
/* 인스타그램·틱톡: 서버 함수(/api/social-stats) → Apify·틱톡 페이지 */
async function socialUpdate(cid,rows,prog){const list=socialRows(rows);if(!list.length)return null;
  let tok='';try{tok=await DB.idToken()}catch(e){}
  const call=async body=>{const r=await fetch('/api/social-stats',{method:'POST',headers:{'content-type':'application/json',...(tok?{authorization:'Bearer '+tok}:{})},body:JSON.stringify(body)});
    if(r.status===404)throw new Error('NOFN');const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('서버 오류 '+r.status));return j};
  const urls=[...new Set(list.map(r=>r.clink))];const res={};const warn=[];const addW=w=>{if(w&&!warn.includes(w))warn.push(w)};
  const st=await call({action:'start',urls});Object.assign(res,st.results||{});(st.warnings||[]).forEach(addW);let jobs=st.jobs||[];const t0=Date.now();
  while(jobs.length&&Date.now()-t0<180000){prog&&prog(Math.round((Date.now()-t0)/1000));await new Promise(r=>setTimeout(r,4000));
    try{const p=await call({action:'poll',jobs});Object.assign(res,p.results||{});(p.warnings||[]).forEach(addW)}catch(e){addW(e.message)}
    jobs=jobs.filter(j=>!(j.urls||[]).every(u=>res[u]))}
  if(jobs.length)addW('일부 게시물은 3분 안에 수집되지 않았습니다. 잠시 후 다시 눌러 주세요.');
  const items=[],mismatch=[],failed=[];
  list.forEach(r=>{const d=res[r.clink];if(!d||d.error){failed.push({name:r.name,why:d?d.error:'결과 없음'});return}
    const acct=(r.acct||'').replace(/^@/,'').toLowerCase();if(acct&&d.owner&&String(d.owner).toLowerCase()!==acct){mismatch.push({name:r.name,acct,owner:d.owner});return}
    const it={rid:r.id};['views','likes','cmts','shares','saves'].forEach(k=>{if(d[k]!=null)it[k]=d[k]});if(/instagram\.com/.test(r.clink)&&d.thumbUrl)it.thumbUrl=d.thumbUrl;items.push(it)});
  const imp=items.length?await importSocial(cid,items):{rows:0,thumbs:0};
  return {updated:imp.rows,thumbs:imp.thumbs,mismatch,failed,warn}}

/* 인스타그램·틱톡 성과 반영: Claude가 게시물을 확인한 결과를 넣음. items=[{rid,views,likes,cmts,shares,saves,thumbUrl}] */
async function importSocial(cid,items){if(!canEdit())throw new Error('수정 권한이 없습니다.');const d=await DB.get('rows/'+cid);const rows=(d&&d.rows)||{};const tdoc=(await DB.get('thumbs/'+cid))||{};const have=tdoc.t||{};

  if(isTrial(c)){const tc=trialCalc(c,s.n);const items=[['제품 제공가치',tc.totalValue!=null?fmt(tc.totalValue)+'원':'–',tc.price!=null?`판매단가 ${fmt(tc.price)}원${tc.qty>1?' × '+tc.qty+'개':''} × ${s.n}명`:'판매단가 미입력 (캠페인 설정)'],['진행',`${s.uploaded}/${s.n}명`,`업로드 완료 / 전체 · 발송 ${s.contract}명`],
    ['조회수',started?compact(s.views):'–',started?`ER ${pct(s.er)}`:'진행 전']];if(!compact_)items.splice(1,0,['신청 경쟁률',fmtX(tc.compete),tc.recruit!=null?`모집 ${fmt(tc.recruit)}명 · 신청 ${tc.apps!=null?fmt(tc.apps):'–'}명`:'모집 정보 미입력 (캠페인 설정)']);return items}
  const fm=feeMode(c);const items=[['광고비 (VAT 별도)',fmt(s.cost)+'원',`${fm==='incl'?`대행수수료 ${feeRate(c)}% 포함 (수수료 ${fmt(s.agf)})`:`대행수수료 미포함 (별도 ${fmt(s.agf)})`} · 원고료 ${fmt(s.fee)}${compact_?'':` · 제안 단가 ${fmt(s.offer)}`}${!compact_&&b?` · 예산 대비 ${pct(s.cost/b,0)}`:''}`],['진행',`${s.uploaded}/${s.n}명`,`업로드 완료 / 전체 · 계약 ${s.contract}명`],
    ['조회수',started?compact(s.views):'–',started?`ER ${pct(s.er)}`:'진행 전'],['CPV',started&&s.cpv!=null?fmt1(s.cpv)+'원':'–','광고비 ÷ 조회']];
  if(M.conv)items.push([cl+' 수',fmt(s.conv),M.clicks?`클릭 ${fmt(s.clicks)}`:'']);if(M.revenue)items.push(['매출',compact(s.rev)+'원',`ROAS ${pct(s.roas,0)}`]);
  return items}
function tabOverview(c,rows){
  const s=summaryOf(c,rows);const gs=groupsOf(c);const st=campStatus(c);
  const cards=gs.map(g=>({g,rows:rows.filter(r=>r.group===g.id)}));const none=rows.filter(r=>!(r.group&&c.groups&&c.groups[r.group]));
  if(gs.length&&none.length)cards.push({g:{id:'__none',name:'그룹 미지정'},rows:none});
  const card=({g,rows:rs})=>{const gsu=summaryOf(c,rs);const real=g.id!=='__none';return `<section class="panel gcard"><div class="row"><h3 class="grow">${real?nameEdit('g',A.cid,g.id,g.name,`<a class="glink" href="#" data-act="goGroup" data-g="${g.id}" data-t="grid" title="이 그룹 진행관리로 이동">${esc(g.name)}</a>`):`<a class="glink" href="#" data-act="goGroup" data-g="${g.id}" data-t="grid">${esc(g.name)}</a>`}</h3><span class="pill ${STATUS_CLS[gsu.status]||''}">${gsu.status}</span></div>
    <div class="small muted">${g.start?md(g.start)+' ~ '+md(g.end):'기간 미입력'}${g.memo?' · '+esc(g.memo):''}</div>${stageBar(gsu.stages,gsu.n,false)}
    <dl class="kv">${sumBlock(c,gsu,true).map(([l,v,x])=>`<dt>${l}</dt><dd>${v} <span class="small muted" style="font-weight:400">${x}</span></dd>`).join('')}</dl>
    ${gsu.alerts?`<div class="small" style="color:var(--crit);font-weight:600">확인 필요 ${gsu.alerts}건</div>`:''}
    <div class="row"><button class="btn sm" data-act="goGroup" data-g="${g.id}" data-t="grid">진행관리</button><button class="btn sm" data-act="goGroup" data-g="${g.id}" data-t="report">성과 리포트</button>${real?`<span class="grow"></span><button class="btn sm danger" data-act="delGroup" data-g="${g.id}" title="그룹만 삭제되고 인플루언서는 「그룹 미지정」으로 옮겨집니다">${A.confirm==='dg'+g.id?'한 번 더 누르면 삭제':'그룹 삭제'}</button>`:''}</div>${real&&A.confirm==='dg'+g.id?`<div class="small muted">그룹만 삭제되고 소속 인플루언서 ${rs.length}명은 「그룹 미지정」으로 옮겨집니다. 데이터는 지워지지 않습니다.</div>`:''}</section>`};
  return `<div class="stack">
  <section class="panel"><div class="panel-h"><div><h2>캠페인 전체</h2><div class="sub">${c.start?md(c.start)+' ~ '+md(c.end)+' · ':''}${esc(c.objective||'')} · 그룹 ${gs.length}개</div></div><div class="row">${isTrial(c)?'':feeSwitch(c)}<span class="pill ${STATUS_CLS[st]||''}">${st}</span></div></div>
   <div class="tiles">${sumBlock(c,s,false).map(([l,v,x])=>tile(l,v,x)).join('')}${tile('확인 필요',fmt(s.alerts),'진행 현황 탭 참고',null,s.alerts?'crit':'')}</div>
   <div style="margin-top:14px">${stageBar(s.stages,s.n,true)}</div></section>
  <div class="panel-h" style="margin:4px 0 -4px"><h2 style="font-size:15px">광고 그룹</h2><div class="row"><input type="text" id="new-group" placeholder="그룹 이름 (예: 1차, 9월)" style="width:200px"><button class="btn" data-act="addGroup">+ 그룹 추가</button></div></div>
  ${cards.length?`<div class="gcards">${cards.map(card).join('')}</div>`:`<div class="panel empty">아직 광고 그룹이 없습니다. 1차/2차, 8월/9월처럼 나눠 관리하려면 그룹을 추가하세요. 그룹 없이도 캠페인 전체로 운영할 수 있습니다.</div>`}
  </div>`;
}

const MODUSIGN_URL='https://app.modusign.co.kr';
const CT_STEPS=['미진행','작성 중','서명 대기','완료'];
function ctOf(r){if(r.contract==='완료')return '완료';if(r.ctStep&&r.ctStep!=='완료')return r.ctStep;return '미진행'}
function ctPill(st){const cls=st==='완료'?'ok':st==='서명 대기'?'accent':st==='작성 중'?'warn':st==='반려·취소'?'crit':'';return `<span class="pill ${cls}">${esc(st)}</span>`}
function ctInfo(c,r){const L=[['캠페인',c.name],['광고주',c.advertiser],['인플루언서명',r.name],['실명',r.realname],['연락처',r.contact],['이메일',r.email],['채널',[r.ch,r.acct].filter(Boolean).join(' ')],['채널 링크',r.chlink],['콘텐츠 유형',r.ctype],['업로드 예정일',r.due],['원고료',has(r.fee)?fmt(r.fee)+'원 (VAT 별도)':''],['2차 활용비',has(r.use)?fmt(r.use)+'원 (VAT 별도)':''],['2차 활용 기간',c.usageMonths?c.usageMonths+'개월':'']];return L.filter(x=>x[1]!=null&&String(x[1]).trim()!=='')}
async function ctSetStep(rid,st){if(!canEdit())return toast('수정 권한이 없습니다.','crit');const r=((A.rowsDoc||{}).rows||{})[rid];if(!r)return;
  const now=new Date().toISOString();const log=[...(Array.isArray(r.ctLog)?r.ctLog:[]),{at:now,step:st,by:(A.user&&A.user.email)||''}].slice(-20);const b=`rows.${rid}.`;
  const up={[b+'ctStep']:st,[b+'ctLog']:log,[b+'contract']:st==='완료'?'완료':'미완료'};if(st==='완료')up[b+'ctDoneAt']=now;
  try{await DB.update('rows/'+A.cid,up);scheduleSync(A.cid);toast(st==='완료'?'계약 완료로 표시했습니다.':`계약 상태: ${st}`)}catch(e){saveErr(e)}}
function ctDrawer(d){const c=curC();const r=((A.rowsDoc||{}).rows||{})[d.rid];if(!c||!r)return null;const st=ctOf(r);const ed=canEdit();const info=ctInfo(c,r);const si=CT_STEPS.indexOf(st);
  const h=`<h2 style="font-size:16px">계약 진행 · ${esc(r.name||'이름 없음')}</h2>`;
  const b=`<div class="banner info" style="margin:0">「모두싸인에서 계약하기」를 누르면 계약 정보가 복사되고 모두싸인이 새 탭으로 열립니다. 모두싸인에서 계약서를 만들어 서명을 요청한 뒤, 이 창에서 진행 상태와 문서 링크를 기록하세요. 계약서 최종본은 문서 링크로 바로 열 수 있습니다.</div>
   <section class="stack" style="gap:8px"><div class="row" style="justify-content:space-between"><b>진행 상태</b>${ctPill(st)}</div>
    <div class="row" style="gap:6px;flex-wrap:wrap">${CT_STEPS.map((x,i)=>`<button class="btn sm ${x===st?'primary':''}" ${ed?`data-act="ctStep" data-r="${d.rid}" data-s="${x}"`:'disabled'} title="${x}로 표시">${i<si||x===st?'✓ ':''}${x}</button>${i<CT_STEPS.length-1?'<span class="muted">→</span>':''}`).join('')}<span class="grow"></span><button class="btn sm ${st==='반려·취소'?'danger':'ghost'}" ${ed?`data-act="ctStep" data-r="${d.rid}" data-s="반려·취소"`:'disabled'}>반려·취소</button></div>
    ${st==='반려·취소'?'<div class="small" style="color:var(--crit)">반려·취소 상태입니다. 다시 진행하면 「작성 중」부터 눌러 주세요.</div>':''}</section>
   <section class="stack" style="gap:6px"><div class="row" style="justify-content:space-between"><b>계약 정보</b><button class="btn sm" data-act="ctCopy" data-r="${d.rid}">복사</button></div>
    ${info.length?`<dl class="kv" style="grid-template-columns:auto 1fr;margin:0">${info.map(([k,v])=>`<dt>${esc(k)}</dt><dd style="text-align:left;font-weight:400;word-break:break-all">${esc(v)}</dd>`).join('')}</dl>`:'<div class="small muted">입력된 정보가 없습니다.</div>'}
    ${!r.email&&!r.contact?'<div class="small" style="color:var(--crit)">연락처·이메일이 비어 있습니다. 모두싸인 서명 요청에 필요하니 진행관리에서 먼저 채워 주세요.</div>':''}</section>
   <label class="f wide">모두싸인 문서 링크<input type="url" data-ctf="ctLink" data-ctr="${d.rid}" value="${esc(r.ctLink||'')}" placeholder="모두싸인 문서 화면의 주소를 붙여넣기" ${ed?'':'disabled'}></label>
   ${r.ctLink?`<div class="row"><a class="btn sm" href="${esc(r.ctLink)}" target="_blank" rel="noopener">계약서 열기 ↗</a><span class="small muted">모두싸인 팀 계정으로 로그인되어 있어야 열립니다.</span></div>`:''}
   <label class="f wide">계약 메모<input type="text" data-ctf="ctMemo" data-ctr="${d.rid}" value="${esc(r.ctMemo||'')}" placeholder="예: 2차 활용 6개월 조항 추가 요청" ${ed?'':'disabled'}></label>
   ${Array.isArray(r.ctLog)&&r.ctLog.length?`<section class="stack" style="gap:4px"><b>기록</b><ul class="small" style="margin:0;padding-left:18px">${r.ctLog.slice().reverse().map(x=>`<li>${fmtDT(x.at)} · ${esc(x.step)}${x.by?` · <span class="muted">${esc(x.by)}</span>`:''}</li>`).join('')}</ul></section>`:''}`;
  const f=`${ed&&st!=='완료'?`<button class="btn primary" data-act="ctGo" data-r="${d.rid}">모두싸인에서 계약하기 ↗</button>`:''}<span class="grow"></span><button class="btn" data-act="rowMenu" data-r="${d.rid}">행 상세</button><button class="btn" data-act="close">닫기</button>`;
  return {h,b,f}}

/* ============ 서랍 (행 상세 / 붙여넣기) ============ */
function drawer(){
  const d=A.drawer;if(!d)return '';let h='',b='',f='';
  if(d.type==='row'){const c=curC();const r=((A.rowsDoc||{}).rows||{})[d.rid];if(!c||!r)return '';const k=rowCalc(r,c);
    h=`<h2 style="font-size:16px">${esc(r.name||'이름 없음')}</h2>`;
    b=`${k.alert?`<div class="banner" style="margin:0">확인 필요: ${esc(k.alert)}</div>`:''}${!isTrial(c)?`<div class="row" style="gap:8px"><b style="font-size:13px">계약</b>${ctPill(ctOf(r))}${r.ctLink?`<a class="small" href="${esc(r.ctLink)}" target="_blank" rel="noopener">계약서 열기 ↗</a>`:''}<span class="grow"></span><button class="btn sm" data-act="ctOpen" data-r="${d.rid}">계약 진행 관리</button></div>`:''}<div class="fgrid">${visibleCols(c).concat(COLS.filter(x=>colOk(c,x)&&A.hide.has(x.g)&&(!x.need||settings(c).M[x.need])&&(x.k!=='group'||groupsOf(c).length))).filter(x=>x.t!=='calc'&&x.t!=='thumb').map(col=>{const id=`d_${d.rid}_${col.k}`;const v=r[col.k];
      if(col.t==='chk')return `<label class="f">${col.l}<span class="row" style="min-height:34px"><input type="checkbox" id="${id}" data-row="${d.rid}" data-f="${col.k}" ${v==='완료'?'checked':''}> <span class="small">${v==='완료'?'완료':'미완료'}</span></span></label>`;
      if(col.t==='grp')return `<label class="f">그룹<select id="${id}" data-row="${d.rid}" data-f="group"><option value="">미지정</option>${groupsOf(c).map(g=>`<option value="${g.id}" ${g.id===v?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label>`;
      const ctl=col.t==='sel'?`<select id="${id}" data-row="${d.rid}" data-f="${col.k}"><option value=""></option>${col.o.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`:`<input id="${id}" type="${col.t==='date'?'date':col.t==='url'?'url':'text'}" ${col.t==='num'?'inputmode="decimal"':''} data-row="${d.rid}" data-f="${col.k}" data-t="${col.t}" value="${esc(col.t==='num'&&has(v)?Number(v).toLocaleString('ko-KR'):v??'')}">`;
      return `<label class="f ${col.k==='memo'||col.k==='clink'||col.k==='chlink'?'wide':''}">${col.l}${ctl}</label>`}).join('')}</div>
      <div class="thumbbox"><div class="prev">${(()=>{const g=galSrc(r.clink,A.thumbs[d.rid]);return g?`<img src="${esc(g.src)}" alt="">`:(r.clink?platOf(r.clink):'없음')})()}</div><div class="stack" style="gap:6px;flex:1"><b style="font-size:13px">썸네일 이미지 ${A.thumbs[d.rid]?'<span class="pill ok">직접 넣음</span>':'<span class="pill">자동</span>'}</b>
        <span class="small muted">유튜브·틱톡은 자동으로 불러옵니다. 인스타그램처럼 자동으로 안 나오면 게시물 화면을 캡처(Win+Shift+S)한 뒤 이 창에서 <b>Ctrl+V</b>로 붙여넣거나 이미지를 선택하세요. 광고주 리포트에도 이 썸네일이 쓰입니다.</span>
        <div class="row"><label class="btn sm" style="cursor:pointer">이미지 선택<input type="file" accept="image/*" data-thumb="${d.rid}" hidden></label>${A.thumbs[d.rid]?`<button class="btn sm danger" data-act="thumbDel" data-r="${d.rid}">직접 넣은 썸네일 삭제</button>`:''}</div></div></div>
      <div class="small muted">자동 계산 · 티어 ${k.tier||'-'} · 집행 비용 ${fmt(k.cost0)}원 · 대행수수료 ${fmt(k.agf)}원 · 광고비(${feeMode(c)==='incl'?'수수료 포함':'수수료 미포함'}) ${fmt(k.cost)}원 · 인게이지먼트 ${fmt(k.eng)} · ER ${pct(k.er)} · CPV ${fmt1(k.cpv)}</div>`;
    f=`<button class="btn danger" data-act="delRow" data-r="${d.rid}">${A.confirm==='dr'+d.rid?'한 번 더 누르면 삭제':'행 삭제'}</button><span class="grow"></span><button class="btn primary" data-act="close">완료</button>`;
  } else if(d.type==='ct'){const x=ctDrawer(d);if(!x)return '';h=x.h;b=x.b;f=x.f;
  } else if(d.type==='pool'||d.type==='poolNew'||d.type==='poolImport'){const x=d.type==='pool'?poolDrawer(d):d.type==='poolNew'?poolNewDrawer():poolImportDrawer(d);if(!x)return '';h=x.h;b=x.b;f=x.f;
  } else if(d.type==='thumbs'){const c=curC();if(!c)return '';const list=curRows().filter(r=>r.name&&r.stage!==DROP&&r.clink).sort((a,b)=>(!!(A.thumbs[a.id]||thumbSrc(a.clink)))-(!!(A.thumbs[b.id]||thumbSrc(b.clink))));
    if(!d.rid||!list.some(r=>r.id===d.rid)){const f0=list.find(r=>!A.thumbs[r.id]&&!thumbSrc(r.clink))||list[0];d.rid=f0?f0.id:''}
    h='<h2 style="font-size:16px">콘텐츠 썸네일 넣기</h2>';
    b=`<div class="banner info" style="margin:0">인스타그램은 로그인 없이 썸네일을 가져올 수 없어 직접 넣어야 합니다. ① 「게시물 열기」로 게시물을 열고 ② 화면을 캡처(Win+Shift+S)한 뒤 ③ 이 창에서 <b>Ctrl+V</b>로 붙여넣으면 <b>선택된 콘텐츠</b>에 저장됩니다. 이미지 파일을 골라도 됩니다.</div>
     <div class="thlist">${list.map(r=>{const own=A.thumbs[r.id],auto=!own&&thumbSrc(r.clink);const g=galSrc(r.clink,own);return `<div class="thitem ${d.rid===r.id?'on':''}"><div class="prev" data-act="thumbPick" data-r="${r.id}">${g?`<img src="${esc(g.src)}" alt="">`:platOf(r.clink)}</div><div class="grow" style="min-width:0;cursor:pointer" data-act="thumbPick" data-r="${r.id}"><b>${esc(r.name)}</b><div class="small muted">${esc([r.acct,r.ctype].filter(Boolean).join(' · '))}</div><div class="small">${own?'<span class="pill ok">직접 넣음</span>':auto?'<span class="pill">자동</span>':'<span class="pill crit">없음</span>'}${d.rid===r.id?' <span class="pill accent">붙여넣기 대상</span>':''}</div></div>
      <div class="stack" style="gap:6px;align-items:flex-end"><a class="btn sm" href="${esc(r.clink)}" target="_blank" rel="noopener">게시물 열기 ↗</a><label class="btn sm" style="cursor:pointer">이미지 선택<input type="file" accept="image/*" data-thumb="${r.id}" hidden></label>${own?`<button class="btn sm danger" data-act="thumbDel" data-r="${r.id}">삭제</button>`:''}</div></div>`}).join('')||'<div class="empty">콘텐츠 링크가 등록된 콘텐츠가 없습니다.</div>'}</div>`;
    f='<span class="small muted grow">썸네일은 어드민 리포트와 광고주 공유 화면에 함께 표시됩니다.</span><button class="btn primary" data-act="close">완료</button>';
  } else if(d.type==='perf'){const o=d.out||{};const L=(arr,f)=>arr&&arr.length?`<ul class="small" style="margin:4px 0 0;padding-left:18px">${arr.map(f).join('')}</ul>`:'';
    h='<h2 style="font-size:16px">성과 불러오기 결과</h2>';
    b=`${o.yt?`<section class="panel"><div class="panel-h"><h2>유튜브</h2></div>${o.yt.err?`<div class="banner" style="margin:0">${esc(o.yt.err)}</div>`:`<p style="margin:0"><b>${o.yt.ok}개</b> 콘텐츠의 조회수·좋아요·댓글 수를 업데이트했습니다.</p>${o.yt.miss.length?`<p class="small muted" style="margin:6px 0 0">찾지 못함 (비공개·삭제 등): ${o.yt.miss.map(esc).join(', ')}</p>`:''}`}</section>`:''}
     ${o.so?`<section class="panel"><div class="panel-h"><h2>인스타그램·틱톡</h2></div>${o.so.err?`<div class="banner" style="margin:0">${esc(o.so.err)}</div>`:`<p style="margin:0"><b>${o.so.updated}개</b> 콘텐츠를 업데이트했고, 새 썸네일 ${o.so.thumbs}개를 저장했습니다.</p>
       ${o.so.mismatch.length?`<div class="banner" style="margin:10px 0 0"><b>링크-계정 불일치 ${o.so.mismatch.length}건 (반영하지 않음)</b> · 진행관리에서 콘텐츠 링크를 확인하세요.${L(o.so.mismatch,x=>`<li>${esc(x.name)} (@${esc(x.acct)}) ← 게시자 @${esc(x.owner)}</li>`)}</div>`:''}
       ${o.so.failed.length?`<p class="small" style="margin:10px 0 0"><b>가져오지 못함 ${o.so.failed.length}건</b>${L(o.so.failed,x=>`<li>${esc(x.name)} · ${esc(x.why)}</li>`)}</p>`:''}
       ${o.so.warn.length?L(o.so.warn,w=>`<li class="muted">${esc(w)}</li>`):''}
       <p class="small muted" style="margin:10px 0 0">인스타그램은 조회수(재생 수)·좋아요·댓글, 틱톡은 조회·좋아요·댓글·공유·저장까지 가져옵니다. 인스타그램 공유·저장·도달은 크리에이터 인사이트로만 확인할 수 있습니다.</p>`}</section>`:''}`;
    f='<span class="small muted grow">광고주 공유 화면에도 반영했습니다.</span><button class="btn primary" data-act="close">확인</button>';
  } else if(d.type==='import'){
    const P=d.preview;const names=Object.fromEntries(COLS.map(x=>[x.k,x.l]));
    h='<h2 style="font-size:16px">엑셀 업로드 · 붙여넣기</h2>';
    b=`${uploadBox('rows',d)}<p class="small muted" style="margin:0">구글 시트 템플릿의 진행관리 탭, 기존 결과 리포트(Name·Platform·Link Post·View 등)도 열 이름을 자동으로 인식합니다. 콘텐츠 링크나 이름이 같은 행이 이미 있으면 새로 추가하지 않고 값을 업데이트합니다.${A.gf&&A.gf!=='__none'?` 그룹 열이 비어 있으면 현재 선택한 「${esc(groupName(curC(),A.gf))}」 그룹에 들어갑니다.`:''}</p>
      <textarea id="imp" rows="6" placeholder="인플루언서명&#9;계정 ID&#9;채널&#9;...">${esc(d.text||'')}</textarea><div class="row"><button class="btn" data-act="impParse">미리보기</button>${P&&P.err?`<span class="small" style="color:var(--crit)">${esc(P.err)}</span>`:''}${P&&P.rows?`<span class="small">인식한 열: ${P.cols.map(k=>names[k]).join(', ')} · ${P.rows.length}행</span>`:''}</div>
      ${P&&P.rows&&P.rows.length?`<div class="tblwrap" style="max-height:320px"><table class="tbl"><thead><tr>${P.cols.map(k=>`<th>${names[k]}</th>`).join('')}</tr></thead><tbody>${P.rows.slice(0,100).map(o=>`<tr>${P.cols.map(k=>`<td class="small">${esc(o[k]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}`;
    f=`<button class="btn" data-act="close">취소</button><button class="btn primary" data-act="impGo" ${P&&P.rows&&P.rows.length?'':'disabled'}>가져오기</button>`;
  }
  return `<div class="drawer-bg" data-act="close"></div><div class="drawer" role="dialog" aria-modal="true"><div class="drawer-h">${h}<button class="btn sm ghost" data-act="close">닫기</button></div><div class="drawer-b">${b}</div><div class="drawer-f">${f}</div></div>`;

function parseMatrix(M){

  if(!M.length)return {err:'내용이 없습니다.'};

  for(let i=0;i<Math.min(6,M.length);i++){const m=M[i].map(mapHdr);if(m.filter(Boolean).length>=2){hi=i;cols=m;break}}

  const seen=new Set();cols=cols.map(k=>k&&!seen.has(k)?(seen.add(k),k):null);
  const rows=M.slice(hi+1).map(cells=>{const o={};cols.forEach((k,i)=>{const v=cells[i]!=null?String(cells[i]).trim():'';if(k&&v!=='')o[k]=v});return o})

}

async function syncPool(cid,c,rows){

const RATE_K=['offer','fee','use','ops','ad'];

  async poolResync(){if(!A.poolLoaded)return toast('풀을 불러오는 중입니다. 잠시 후 다시 누르세요.');A.confirm='resync';render();let k=0;
    for(const [id,c] of Object.entries(A.campaigns)){try{const rd=await DB.get('rows/'+id);await syncPool(id,c,rowsArr(rd));k++}catch(e){console.error(e)}}
    A.confirm=null;toast(`캠페인 ${k}개의 인플루언서를 풀에 반영했습니다.`);render()},
});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset.pf)return;const f=t.dataset.pf;let v=t.value;const up={};
  if(f==='rating')v=v?Number(v):null;else if(f==='exclude')v=v==='true';else if(f==='fol'){v=parseNum(v);up.tier=tierOf(v)||''}else if(RATE_K.includes(f)){v=parseNum(v);up.rateDate=today();const p=A.pool[t.dataset.p]||{};const g=poolAgg(p);RATE_K.forEach(k=>{if(k!==f&&!has(p[k])&&g['r_'+k]!=null)up[k]=Math.round(g['r_'+k])})}else v=v.trim();
  if(f==='email'&&v&&!isEmail(v)){toast('이메일 형식을 확인하세요.','crit');return}up.updatedAt=today();
  if(f==='name'&&!v){toast('이름은 비울 수 없습니다.','crit');return}up[f]=v;if(['name','fol','cat','contact','chlink','email'].includes(f))up.manual=true;DB.update('pool/'+t.dataset.p,up).catch(saveErr)});
</script>
<script type="text/plain" id="rules-src">
rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() {
      return request.auth != null && request.auth.token.email_verified == true;
    }
    function me() {
      return /databases/$(database)/documents/admins/$(request.auth.token.email.lower());
    }
    // 팀원 여부 (마스터·매니저·뷰어 모두)
    function isAdmin() {
      return signedIn() && exists(me());
    }
    // 권한: 기록이 없으면 뷰어로 취급
    function role() {
      return get(me()).data.get('role', 'viewer');
    }
    // 수정 가능: 마스터·매니저
    function canEdit() {
      return isAdmin() && role() in ['master', 'manager'];
    }
    function isMaster() {
      return isAdmin() && role() == 'master';
    }
    // 팀원 목록: 팀원 모두 읽기 / 추가는 마스터·매니저(매니저는 매니저·뷰어로만) / 권한 변경·삭제는 마스터만
    match /admins/{email} {
      allow read: if isAdmin();
      allow create: if canEdit() && (isMaster() || request.resource.data.role in ['manager', 'viewer']);
      allow update: if isMaster();
      allow delete: if isMaster() && email != request.auth.token.email.lower();
    }
    // 캠페인·진행관리·인플루언서 풀: 팀원 모두 읽기, 마스터·매니저만 수정
    match /campaigns/{id} {
      allow read: if isAdmin();
      allow write: if canEdit();
    }
    match /rows/{id} {
      allow read: if isAdmin();
      allow write: if canEdit();
    }
    match /pool/{id} {
      allow read: if isAdmin();
      allow write: if canEdit();
    }
    // 썸네일(직접 넣은 이미지): 팀원 읽기, 마스터·매니저 수정
    match /thumbs/{id} {
      allow read: if isAdmin();
      allow write: if canEdit();
    }
    // 광고주 공유용 썸네일: 링크를 아는 사람만 한 건씩 읽기
    match /sharethumbs/{token} {
      allow get: if true;
      allow list: if false;
      allow write: if canEdit();
    }
    // 광고주 공유본: 링크(토큰)를 아는 사람만 한 건씩 읽기 가능, 목록 조회 불가
    match /shares/{token} {
      allow get: if true;
      allow list: if false;
      allow write: if canEdit();
    }
    // 연동 설정(유튜브 API 키 등): 팀원 모두 읽기, 마스터만 수정
    match /settings/{id} {
      allow read: if isAdmin();
      allow write: if isMaster();
    }
  }
}
</script>
