# RINGCOMS 캠페인 관리 · Netlify 배포 설정
[build]
  publish = "public"
  functions = "netlify/functions"
  command = ""
  # main 이외 브랜치(work·ops 등)는 빌드·배포하지 않음 — 크레딧 절약 (종료 코드 0 = 이번 빌드 건너뜀)
  ignore = "if [ \"$BRANCH\" = \"main\" ]; then exit 1; else exit 0; fi"

[functions]
  node_bundler = "esbuild"
  # 영상 검수 장면 캡처용 ffmpeg 실행 파일을 함께 배포 (번들에 넣지 않고 패키지째 포함)
  external_node_modules = ["ffmpeg-static"]

[functions.review]
  included_files = ["node_modules/ffmpeg-static/ffmpeg"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 인플루언서 전용 단축 링크: ad.ringcoms.com/l/{코드} → 브릿지 페이지 (주소는 그대로 유지)
[[redirects]]
  from = "/l/*"
  to = "/l.html"
  status = 200

[[headers]]
  for = "/l.html"
  [headers.values]
    Cache-Control = "public, max-age=300"
